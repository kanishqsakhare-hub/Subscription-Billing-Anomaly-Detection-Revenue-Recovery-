<svg xmlns="http://www.w3.org/2000/svg" width="2050" height="1060" viewBox="0 0 2050 1060" role="img" aria-labelledby="title desc">
  <title id="title">SaaS subscription revenue assurance entity relationship diagram</title>
  <desc id="desc">Ten imported PostgreSQL tables plus the derived reconciliation case queue, with primary and foreign key relationships.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.table{fill:#fff;stroke:#334155;stroke-width:2}.derived{fill:#fffbeb;stroke:#b45309;stroke-width:2}.head{fill:#0f766e}.head2{fill:#b45309}.title{font:700 24px system-ui,sans-serif;fill:#fff}.field{font:17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#1e293b}.pk{font-weight:700;fill:#0f766e}.fk{fill:#1d4ed8}.edge{fill:none;stroke:#64748b;stroke-width:2}.optional{stroke-dasharray:7 6}.card{font:700 15px system-ui,sans-serif;fill:#475569}.note{font:17px system-ui,sans-serif;fill:#475569}.heading{font:700 34px system-ui,sans-serif;fill:#0f172a}.sub{font:18px system-ui,sans-serif;fill:#475569}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="2050" height="1060"/>
  <text class="heading" x="40" y="45">PostgreSQL data model</text>
  <text class="sub" x="445" y="44">solid = required parent · dashed = optional payment link · gold = derived workflow table</text>

  <!-- relationships are drawn first so table cards remain legible -->
  <path class="edge" marker-end="url(#arrow)" d="M300 145H360V220H420"/><text class="card" x="315" y="137">1</text><text class="card" x="394" y="211">0..*</text>
  <path class="edge" marker-end="url(#arrow)" d="M300 385H350V335H420"/><text class="card" x="310" y="377">1</text><text class="card" x="392" y="327">0..*</text>
  <path class="edge" marker-end="url(#arrow)" d="M720 220H785V120H850"/><text class="card" x="727" y="212">1</text><text class="card" x="820" y="111">0..*</text>
  <path class="edge" marker-end="url(#arrow)" d="M300 410H760V180H850"/><text class="card" x="310" y="402">1</text><text class="card" x="818" y="171">0..*</text>
  <path class="edge" marker-end="url(#arrow)" d="M720 270H805V350H850"/><text class="card" x="727" y="262">1</text><text class="card" x="818" y="341">0..*</text>
  <path class="edge" marker-end="url(#arrow)" d="M720 330H770V585H850"/><text class="card" x="727" y="322">1</text><text class="card" x="818" y="576">0..*</text>
  <path class="edge" marker-end="url(#arrow)" d="M1150 585H1210V545H1260"/><text class="card" x="1160" y="577">1</text><text class="card" x="1228" y="536">0..*</text>
  <path class="edge" marker-end="url(#arrow)" d="M720 355H740V465H1225V610H1260"/><text class="card" x="727" y="347">1</text><text class="card" x="1230" y="600">0..*</text>
  <path class="edge" marker-end="url(#arrow)" d="M1150 620H1580V245H1640"/><text class="card" x="1160" y="612">1</text><text class="card" x="1605" y="236">0..*</text>
  <path class="edge optional" marker-end="url(#arrow)" d="M1560 555H1610V315H1640"/><text class="card" x="1570" y="547">0..1</text><text class="card" x="1607" y="306">0..*</text>
  <path class="edge" marker-end="url(#arrow)" d="M720 375H755V485H1600V380H1640"/><text class="card" x="727" y="367">1</text><text class="card" x="1605" y="371">0..*</text>
  <path class="edge" marker-end="url(#arrow)" d="M1150 655H1570V570H1640"/><text class="card" x="1160" y="647">1</text><text class="card" x="1607" y="561">0..*</text>
  <path class="edge" marker-end="url(#arrow)" d="M1560 645H1600V640H1640"/><text class="card" x="1570" y="637">1</text><text class="card" x="1607" y="631">0..*</text>
  <path class="edge" marker-end="url(#arrow)" d="M720 390H735V745H1610V700H1640"/><text class="card" x="727" y="382">1</text><text class="card" x="1607" y="691">0..*</text>
  <path class="edge" marker-end="url(#arrow)" d="M1080 710V750H1260V835"/><text class="card" x="1088" y="733">1</text><text class="card" x="1230" y="826">0..*</text>
  <path class="edge" marker-end="url(#arrow)" d="M720 365H745V1010H1200V905H1260"/><text class="card" x="727" y="357">1</text><text class="card" x="1228" y="896">0..*</text>
  <path class="edge" marker-end="url(#arrow)" d="M1010 710V815H1015"/><text class="card" x="1018" y="743">1</text><text class="card" x="985" y="805">0..1</text>

  <g transform="translate(40 80)"><rect class="table" width="260" height="140" rx="8"/><rect class="head" width="260" height="42" rx="8"/><text class="title" x="14" y="29">customers</text><text class="field pk" x="14" y="70">PK customer_id</text><text class="field" x="14" y="95">signup_date</text><text class="field" x="14" y="120">segment attributes</text></g>
  <g transform="translate(40 310)"><rect class="table" width="260" height="170" rx="8"/><rect class="head" width="260" height="42" rx="8"/><text class="title" x="14" y="29">subscription_plans</text><text class="field pk" x="14" y="70">PK plan_id</text><text class="field" x="14" y="95">plan_name</text><text class="field" x="14" y="120">billing_interval</text><text class="field" x="14" y="145">price</text></g>
  <g transform="translate(420 170)"><rect class="table" width="300" height="230" rx="8"/><rect class="head" width="300" height="42" rx="8"/><text class="title" x="14" y="29">subscriptions</text><text class="field pk" x="14" y="70">PK subscription_id</text><text class="field fk" x="14" y="95">FK customer_id</text><text class="field fk" x="14" y="120">FK plan_id</text><text class="field" x="14" y="145">start_date / end_date</text><text class="field" x="14" y="170">status</text><text class="field" x="14" y="195">record_source</text></g>
  <g transform="translate(850 40)"><rect class="table" width="330" height="210" rx="8"/><rect class="head" width="330" height="42" rx="8"/><text class="title" x="14" y="29">plan_changes</text><text class="field pk" x="14" y="70">PK change_id</text><text class="field fk" x="14" y="95">FK subscription_id</text><text class="field fk" x="14" y="120">FK old_plan_id</text><text class="field fk" x="14" y="145">FK new_plan_id</text><text class="field" x="14" y="170">change_date</text></g>
  <g transform="translate(850 290)"><rect class="table" width="300" height="160" rx="8"/><rect class="head" width="300" height="42" rx="8"/><text class="title" x="14" y="29">churn_events</text><text class="field pk" x="14" y="70">PK churn_event_id</text><text class="field fk" x="14" y="95">FK subscription_id</text><text class="field" x="14" y="120">churn_date / reason</text></g>
  <g transform="translate(850 520)"><rect class="table" width="300" height="190" rx="8"/><rect class="head" width="300" height="42" rx="8"/><text class="title" x="14" y="29">invoices</text><text class="field pk" x="14" y="70">PK invoice_id</text><text class="field fk" x="14" y="95">FK subscription_id</text><text class="field" x="14" y="120">invoice_date / due_date</text><text class="field" x="14" y="145">amount / status</text></g>
  <g transform="translate(1260 480)"><rect class="table" width="300" height="220" rx="8"/><rect class="head" width="300" height="42" rx="8"/><text class="title" x="14" y="29">payments</text><text class="field pk" x="14" y="70">PK payment_id</text><text class="field fk" x="14" y="95">FK invoice_id</text><text class="field fk" x="14" y="120">FK subscription_id</text><text class="field" x="14" y="145">payment_date / amount</text><text class="field" x="14" y="170">status / failure_reason</text></g>
  <g transform="translate(1640 170)"><rect class="table" width="360" height="260" rx="8"/><rect class="head" width="360" height="42" rx="8"/><text class="title" x="14" y="29">payment_attempts</text><text class="field pk" x="14" y="70">PK attempt_id</text><text class="field fk" x="14" y="95">FK invoice_id</text><text class="field fk" x="14" y="120">FK payment_id (nullable)</text><text class="field fk" x="14" y="145">FK subscription_id</text><text class="field" x="14" y="170">attempt_date / number</text><text class="field" x="14" y="195">attempted_amount / outcome</text><text class="field" x="14" y="220">failure_reason</text></g>
  <g transform="translate(1640 500)"><rect class="table" width="340" height="230" rx="8"/><rect class="head" width="340" height="42" rx="8"/><text class="title" x="14" y="29">refunds</text><text class="field pk" x="14" y="70">PK refund_id</text><text class="field fk" x="14" y="95">FK invoice_id</text><text class="field fk" x="14" y="120">FK payment_id</text><text class="field fk" x="14" y="145">FK subscription_id</text><text class="field" x="14" y="170">date / amount / reason</text></g>
  <g transform="translate(1260 780)"><rect class="table" width="330" height="200" rx="8"/><rect class="head" width="330" height="42" rx="8"/><text class="title" x="14" y="29">revenue_recovery</text><text class="field pk" x="14" y="70">PK recovery_id</text><text class="field fk" x="14" y="95">FK invoice_id</text><text class="field fk" x="14" y="120">FK subscription_id</text><text class="field" x="14" y="145">at-risk / recovered amount</text><text class="field" x="14" y="170">type / date / status</text></g>
  <g transform="translate(850 815)"><rect class="derived" width="330" height="205" rx="8"/><rect class="head2" width="330" height="42" rx="8"/><text class="title" x="14" y="29">reconciliation_case_queue</text><text class="field pk" x="14" y="70">PK case_id</text><text class="field fk" x="14" y="95">FK/UQ invoice_id</text><text class="field" x="14" y="120">reason / status / priority</text><text class="field" x="14" y="145">source_class / notes</text><text class="field" x="14" y="170">created / updated / resolved</text></g>
</svg>
