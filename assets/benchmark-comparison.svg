<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Warm-run query performance before and after indexing</title>
  <desc id="desc">Six benchmark comparisons measured on PostgreSQL 18.4. Bars are normalized within each query and exact milliseconds are labeled.</desc>
  <defs><style>.bg{fill:#f8fafc}.h{font:700 30px system-ui,sans-serif;fill:#0f172a}.s{font:16px system-ui,sans-serif;fill:#475569}.q{font:600 17px system-ui,sans-serif;fill:#1e293b}.v{font:15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#334155}.before{fill:#94a3b8}.after{fill:#0f766e}.slower{fill:#c2410c}.grid{stroke:#e2e8f0;stroke-width:1}.gain{font:700 16px system-ui,sans-serif;fill:#047857}.loss{font:700 16px system-ui,sans-serif;fill:#c2410c}</style></defs>
  <rect class="bg" width="1200" height="650"/>
  <text class="h" x="40" y="48">PostgreSQL 18.4 warm-run benchmark</text>
  <text class="s" x="40" y="76">Second execution, identical data and settings. Bar lengths are normalized within each query; labels show exact execution time.</text>
  <rect class="before" x="40" y="96" width="18" height="12" rx="2"/><text class="s" x="66" y="107">before indexes</text><rect class="after" x="190" y="96" width="18" height="12" rx="2"/><text class="s" x="216" y="107">after indexes</text>

  <g transform="translate(40 135)"><text class="q" y="18">B1 Effective-dated snapshot MRR</text><rect class="before" x="350" y="0" width="700" height="16" rx="3"/><rect class="after" x="350" y="22" width="36" height="16" rx="3"/><text class="v" x="1060" y="14">23,173.213 ms</text><text class="v" x="396" y="36">1,192.708 ms</text><text class="gain" x="930" y="38">94.9% faster</text></g>
  <g transform="translate(40 215)"><text class="q" y="18">B2 Failed-payment reconciliation</text><rect class="before" x="350" y="0" width="700" height="16" rx="3"/><rect class="after" x="350" y="22" width="529" height="16" rx="3"/><text class="v" x="1060" y="14">216.494 ms</text><text class="v" x="889" y="36">163.639 ms</text><text class="gain" x="930" y="62">24.4% faster</text></g>
  <g transform="translate(40 295)"><text class="q" y="18">B3 Recurring-invoice cadence</text><rect class="before" x="350" y="0" width="700" height="16" rx="3"/><rect class="after" x="350" y="22" width="554" height="16" rx="3"/><text class="v" x="1060" y="14">874.007 ms</text><text class="v" x="914" y="36">691.758 ms</text><text class="gain" x="930" y="62">20.9% faster</text></g>
  <g transform="translate(40 375)"><text class="q" y="18">B4 Final-attempt reconciliation</text><rect class="before" x="350" y="0" width="700" height="16" rx="3"/><rect class="after" x="350" y="22" width="532" height="16" rx="3"/><text class="v" x="1060" y="14">1,401.318 ms</text><text class="v" x="892" y="36">1,065.169 ms</text><text class="gain" x="930" y="62">24.0% faster</text></g>
  <g transform="translate(40 455)"><text class="q" y="18">B5 Unresolved-recovery aging</text><rect class="before" x="350" y="0" width="512" height="16" rx="3"/><rect class="slower" x="350" y="22" width="700" height="16" rx="3"/><text class="v" x="872" y="14">128.868 ms</text><text class="v" x="1060" y="36">176.060 ms</text><text class="loss" x="930" y="62">36.6% slower</text></g>
  <g transform="translate(40 535)"><text class="q" y="18">B6 Monthly successful collections</text><rect class="before" x="350" y="0" width="695" height="16" rx="3"/><rect class="slower" x="350" y="22" width="700" height="16" rx="3"/><text class="v" x="1055" y="14">177.986 ms</text><text class="v" x="1060" y="36">179.377 ms</text><text class="loss" x="930" y="62">0.8% slower</text></g>
  <text class="s" x="40" y="625">Measured 2026-10-21 with JIT off, work_mem 4 MB, track_io_timing on, and two parallel workers.</text>
</svg>
